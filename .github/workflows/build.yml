name: CI

on:
  push:
  pull_request:

jobs:
  formatting-check:
    name: Formatting check
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get install dos2unix

      - name: Check line breaks
        run: |
          ci-extra/check-lines.sh

      - name: Run clang-format style check
        uses: jidicula/clang-format-action@v4.14.0
        with:
          clang-format-version: '19'
          check-path: '.'

  test:
    needs: formatting-check
    name: Ruby tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.8'
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

  plod-check:
    needs: formatting-check
    name: Plod check devices
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.8'
          bundler-cache: true

      - name: Check device descriptions
        run: bundle exec exe/plod check lib/Devices/*.rb

      - name: Verify generated headers compile
        run: |
          mkdir -p /tmp/plod-headers
          for dev in Clint ns16550 Uart8250; do
            bundle exec exe/plod build lib/Devices/$(echo $dev | tr 'A-Z' 'a-z').rb -d $dev -o /tmp/plod-headers/$dev.hh
          done
          for dev in Clint ns16550 Uart8250; do
            g++ -std=c++23 -fsyntax-only -I tests/support/gem5_stub /tmp/plod-headers/$dev.hh
          done

  build:
    needs: [formatting-check, test, plod-check]
    name: Build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        build-type:
          - Release
          - Debug
    env:
      CMAKE_PRESET: "Default-${{ matrix.build-type }}"
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.8'
          bundler-cache: true

      - name: Build
        run: ci-extra/build.sh "$CMAKE_PRESET"
